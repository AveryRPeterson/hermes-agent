name: Desktop Bundled Release

# This workflow builds the fully self-contained desktop installers for each
# (os, arch) target. The agent payloads are baked in: the repo snapshot at
# the release tag, uv plus CPython, the wheelhouse, node, and the prebuilt
# TUI/dashboard JS. The design is in
# .hermes/plans/2026-08-05_desktop-bundled-payloads-channels-eject.md.
#
# The full bundled-install stack (install manifest, --payload-dir stages,
# desktop adoption and re-materialization) stays dormant unless a build sets
# HERMES_DESKTOP_BUNDLED=1. This workflow is the only place that sets it.
#
# Triggers:
#   * A push of a final release tag (vX.Y.Z). This is the normal release path.
#   * workflow_dispatch with an explicit tag, for re-runs and dry runs. The
#     release upload is opt-in.
#
# Each runner fetches wheels, uv, python, and node natively. This is why the
# workflow is a matrix: electron-builder needs per-OS runners for signing.
# As a result, there are no cross-platform wheel-tag tables anywhere.
#
# Signing and notarization: if the APPLE_* and CSC_* secrets are absent,
# notarize.mjs and electron-builder skip those steps. Thus this workflow
# produces unsigned artifacts on forks. When the org secrets are set, it
# produces signed artifacts.

on:
  push:
    tags:
      - 'v[0-9]+.[0-9]+.[0-9]+'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Release tag to bundle (vX.Y.Z). Must exist on the repo.'
        required: true
        type: string
      upload_release:
        description: 'Attach artifacts to the GitHub release for the tag'
        required: false
        type: boolean
        default: false

permissions:
  contents: write # for the release asset upload; read-only for all other content

concurrency:
  group: desktop-bundled-release-${{ github.event.inputs.tag || github.ref }}
  cancel-in-progress: false

jobs:
  build:
    name: ${{ matrix.label }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        include:
          # electron-builder targets are chosen by the shared script from
          # the runner platform: linux AppImage, mac dmg+zip, win nsis.
          - label: linux-x64
            runner: ubuntu-24.04
          - label: linux-arm64
            runner: ubuntu-24.04-arm
          - label: darwin-arm64
            runner: macos-15
          - label: darwin-x64
            runner: macos-15-intel
          - label: win32-x64
            runner: windows-2025
    env:
      # This is the one switch that turns on the whole bundled stack.
      HERMES_DESKTOP_BUNDLED: '1'
      HERMES_PAYLOAD_TAG: ${{ github.event.inputs.tag || github.ref_name }}
      HERMES_PAYLOAD_PYTHON: '3.11'
    steps:
      - name: Validate tag shape
        shell: bash
        run: |
          case "$HERMES_PAYLOAD_TAG" in
            v[0-9]*.[0-9]*.[0-9]*) echo "tag: $HERMES_PAYLOAD_TAG" ;;
            *) echo "::error::'$HERMES_PAYLOAD_TAG' is not a final release tag (vX.Y.Z)"; exit 1 ;;
          esac

      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          ref: ${{ env.HERMES_PAYLOAD_TAG }}
          # stage-agent-payloads clones the payload repo from this checkout
          # at the tag. A depth-1 checkout at the tag is sufficient, but the
          # tag ref must exist locally.
          fetch-tags: true

      # ── Node ──────────────────────────────────────────────────────────
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 26
          cache: npm

      - name: grab npm 12
        shell: bash
        run: npm i -g npm@12

      - uses: ./.github/actions/retry
        with:
          command: npm ci

      # ── uv + Python (native to this runner) ───────────────────────────
      # setup-python gives every OS a working `python3` on PATH. The desktop
      # `npm run build` shells out to scripts/write_install_stamp.py, and the
      # Windows runner image does not guarantee a python3 alias.
      - uses: actions/setup-python@e348410e00f449ece8581cb8e88be8f0e7712da6 # v5
        with:
          python-version: '3.12'

      - name: Install uv
        uses: astral-sh/setup-uv@fac544c07dec837d0ccb6301d7b5580bf5edae39 # 8.2.0
        with:
          version: '0.9.28'
          enable-cache: true
          cache-dependency-glob: |
            pyproject.toml
            uv.lock

      # ── Build + package through the shared script ──────────────────────
      # scripts/build-bundled-desktop.mjs owns the whole sequence: the JS
      # surface builds, the payload node dist, the bundled desktop build,
      # and electron-builder. Run the same script locally to reproduce a
      # CI build. The workflow adds only caching, signing, and upload.
      # npm ci already ran above, so pass --no-install.
      - name: Build and package
        shell: bash
        env:
          HERMES_BUNDLE_TAG: ${{ env.HERMES_PAYLOAD_TAG }}
          # macOS signing and notarization. Forks do not have the secrets.
          # notarize.mjs and electron-builder both skip without them.
          APPLE_API_KEY: ${{ secrets.APPLE_API_KEY }}
          APPLE_API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
          APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
          CSC_LINK: ${{ secrets.CSC_LINK }}
          CSC_KEY_PASSWORD: ${{ secrets.CSC_KEY_PASSWORD }}
          # Windows signing with Azure Trusted Signing. The signing DLib
          # authenticates with these three variables at sign time. The
          # certificate never touches the runner disk.
          AZURE_TENANT_ID: ${{ secrets.AZURE_TENANT_ID }}
          AZURE_CLIENT_ID: ${{ secrets.AZURE_CLIENT_ID }}
          AZURE_CLIENT_SECRET: ${{ secrets.AZURE_CLIENT_SECRET }}
          # Non-secret Azure signing parameters. Set these repo variables to
          # turn Windows signing on. Without them the build stays unsigned,
          # so forks and dry runs continue to work.
          AZURE_SIGN_ENDPOINT: ${{ vars.AZURE_SIGN_ENDPOINT }}
          AZURE_SIGN_ACCOUNT: ${{ vars.AZURE_SIGN_ACCOUNT }}
          AZURE_SIGN_PROFILE: ${{ vars.AZURE_SIGN_PROFILE }}
          AZURE_SIGN_PUBLISHER: ${{ vars.AZURE_SIGN_PUBLISHER }}
        run: |
          SIGN_ARGS=()
          if [ "${{ matrix.label }}" = "win32-x64" ] && [ -n "$AZURE_SIGN_ENDPOINT" ] && [ -n "$AZURE_CLIENT_SECRET" ]; then
            echo "Windows signing: Azure Trusted Signing at $AZURE_SIGN_ENDPOINT"
            SIGN_ARGS+=(
              "-c.win.signAndEditExecutable=true"
              "-c.win.sign.type=azure"
              "-c.win.sign.endpoint=$AZURE_SIGN_ENDPOINT"
              "-c.win.sign.codeSigningAccountName=$AZURE_SIGN_ACCOUNT"
              "-c.win.sign.certificateProfileName=$AZURE_SIGN_PROFILE"
              "-c.win.sign.publisherName=$AZURE_SIGN_PUBLISHER"
            )
          fi
          node scripts/build-bundled-desktop.mjs --tag="$HERMES_BUNDLE_TAG" --no-install -- "${SIGN_ARGS[@]}"

      - name: Upload artifacts
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: hermes-bundled-${{ matrix.label }}-${{ env.HERMES_PAYLOAD_TAG }}
          path: |
            apps/desktop/release/*.dmg
            apps/desktop/release/*.zip
            apps/desktop/release/*.exe
            apps/desktop/release/*.AppImage
            apps/desktop/release/*.blockmap
            apps/desktop/release/latest*.yml
          retention-days: 30
          if-no-files-found: error

      # ── Attach to the GitHub release (tag pushes and opt-in dispatch) ────
      - name: Upload to GitHub release
        if: github.event_name == 'push' || github.event.inputs.upload_release == 'true'
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          shopt -s nullglob
          files=(apps/desktop/release/*.dmg apps/desktop/release/*.zip \
                 apps/desktop/release/*.exe apps/desktop/release/*.AppImage \
                 apps/desktop/release/*.blockmap apps/desktop/release/latest*.yml)
          if [ ${#files[@]} -eq 0 ]; then
            echo "::error::no release artifacts found"; exit 1
          fi
          gh release create "$HERMES_PAYLOAD_TAG" --verify-tag --draft --title "$HERMES_PAYLOAD_TAG" 2>/dev/null || true
          gh release upload "$HERMES_PAYLOAD_TAG" "${files[@]}" --clobber
